<!doctype html>
<!--
  Bayesian Chef: the whole app is this page plus the files it loads.
  Open it straight from disk (double-click) or serve the app/ folder with any
  web server. Nothing is fetched from the internet.

  Load order matters: engine/ files first (the maths, on window.BC), then
  ui/ files (the interface, on window.Chef), with ui/app.js last because it
  starts the app. See docs/code-tour.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayesian Chef</title>
<meta name="description" content="Design experiments for your cooking, taste blind, and let a Bayesian model suggest what to try next.">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header: logo, tabs (desktop), experiment menu, save-status dot, Guide and Advanced settings buttons -->
<header class="app-header">
  <div class="hdr">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="16" fill="var(--honey)"/>
        <path d="M8 20 C 8 14, 26 14, 26 20 L 24 24 C 22 26, 12 26, 10 24 Z" fill="var(--surface)" stroke="var(--on-honey)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M11 12 q2 -3 0 -6 M17 11 q2 -3 0 -6 M23 12 q2 -3 0 -6" fill="none" stroke="var(--marm-bright)" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">Bayesian <b>Chef</b></span>
    </div>
    <nav class="topnav" id="topnav" aria-label="Sections"></nav>
    <span class="spacer"></span>
    <div class="exp"><select id="project-select" aria-label="Current experiment"></select></div>
    <span class="status-dot" id="status-dot" role="img" aria-label="Save status"></span>
    <button class="icon-btn" type="button" data-act="open-help" aria-label="Help and tasting guide">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.7 2.4c-.8.4-1.2 1-1.2 1.8v.6"/><circle cx="12" cy="17.3" r="0.6" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" type="button" data-act="open-settings" aria-label="Advanced settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</header>
<!-- The visible tab is drawn in here by ui/app.js render() -->
<main id="main" aria-live="polite"></main>
<!-- Phone-sized screens: tab bar at the bottom instead of the top -->
<nav class="bottomnav" id="bottomnav" aria-label="Sections"></nav>
<!-- Slide-over panels and dialogs are drawn into these -->
<div id="sheet-root"></div>
<div id="modal-root"></div>

<!-- The engine: pure maths, no screen code (window.BC) -->
<script src="engine/core.js"></script>
<script src="engine/space.js"></script>
<script src="engine/models.js"></script>
<script src="engine/optimize.js"></script>
<script src="engine/analytics.js"></script>
<script src="engine/library.js"></script>
<script src="engine/example-data.js"></script>

<!-- The interface (window.Chef). Plotly (vendor/plotly.min.js) is loaded later, only when Insights opens. -->
<script src="ui/core.js"></script>
<script src="ui/state.js"></script>
<script src="ui/storage.js"></script>
<script src="ui/components.js"></script>
<script src="ui/actions.js"></script>
<script src="ui/views/cook.js"></script>
<script src="ui/views/insights.js"></script>
<script src="ui/views/charts.js"></script>
<script src="ui/views/log.js"></script>
<script src="ui/views/setup.js"></script>
<script src="ui/views/panels.js"></script>
<script src="ui/events.js"></script>
<script src="ui/app.js"></script>
</body>
</html>
