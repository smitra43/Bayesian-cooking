<title>Bayesian Chef</title>
<meta name="description" content="Design experiments for your cooking, taste blind, and let a Bayesian model suggest what to try next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* ------------------------------------------------------------ tokens */
:root {
  --bg: #fcf7ec;
  --surface: #fffdf8;
  --surface-2: #f8efdb;
  --surface-3: #f1e1b9;
  --line: #eee2c6;
  --line-strong: #dfca9c;
  --ink: #32221a;
  --ink-2: #6a5343;
  --ink-3: #9a846d;
  --honey: #f6b73c;
  --honey-hover: #eea823;
  --honey-soft: #fdefc8;
  --marm: #bf520d;
  --marm-bright: #ec7a2a;
  --marm-soft: #fde2cc;
  --on-honey: #2c1b0d;
  --good: #3b7a33;
  --good-soft: #e3f1d8;
  --warn: #8f5b00;
  --warn-soft: #fcebc4;
  --bad: #b23b27;
  --bad-soft: #fbe0d8;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --seq-0: #fff1cc;
  --seq-1: #f9ca6b;
  --seq-2: #ef9b3b;
  --seq-3: #cf6419;
  --seq-4: #8a3a0e;
  --div-neg: #2a78d6;
  --div-mid: #ece4d6;
  --div-pos: #df641a;
  --shadow-sm: 0 1px 2px rgba(90, 60, 20, 0.06);
  --shadow-lg: 0 24px 60px -20px rgba(70, 40, 10, 0.35);
  --scrim: rgba(38, 24, 10, 0.38);
  --r-card: 18px;
  --r-ctl: 12px;
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --nav-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #16100a; --surface: #20170f; --surface-2: #2a1f15; --surface-3: #3a2a1b; --line: #36281b; --line-strong: #56412e;
    --ink: #f8ead6; --ink-2: #d3b893; --ink-3: #9c8266; --honey: #f5bf52; --honey-hover: #f0ad2c; --honey-soft: #3a2b12;
    --marm: #f59a55; --marm-bright: #f08a3c; --marm-soft: #4a2a14; --on-honey: #231406;
    --good: #93cf83; --good-soft: #213219; --warn: #f2c265; --warn-soft: #382a0f; --bad: #f39a86; --bad-soft: #3f1f18;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --seq-0: #37251a; --seq-1: #7a4a1c; --seq-2: #c26a22; --seq-3: #f0a043; --seq-4: #ffd98a;
    --div-neg: #3987e5; --div-mid: #3a2f26; --div-pos: #f08a3c;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.7); --scrim: rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16100a; --surface: #20170f; --surface-2: #2a1f15; --surface-3: #3a2a1b; --line: #36281b; --line-strong: #56412e;
  --ink: #f8ead6; --ink-2: #d3b893; --ink-3: #9c8266; --honey: #f5bf52; --honey-hover: #f0ad2c; --honey-soft: #3a2b12;
  --marm: #f59a55; --marm-bright: #f08a3c; --marm-soft: #4a2a14; --on-honey: #231406;
  --good: #93cf83; --good-soft: #213219; --warn: #f2c265; --warn-soft: #382a0f; --bad: #f39a86; --bad-soft: #3f1f18;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --seq-0: #37251a; --seq-1: #7a4a1c; --seq-2: #c26a22; --seq-3: #f0a043; --seq-4: #ffd98a;
  --div-neg: #3987e5; --div-mid: #3a2f26; --div-pos: #f08a3c;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.7); --scrim: rgba(0, 0, 0, 0.55);
}

/* ------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.7rem, 4.5vw, 2.2rem); letter-spacing: 0.005em; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; }
h3 { font-size: 1rem; font-weight: 800; }
h4 { font-size: 0.9rem; font-weight: 800; }
p { margin: 0; }
a, .link { color: var(--marm); font-weight: 700; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; font-weight: 700; }
.link:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; border-radius: 10px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 0.86rem; }
.mono { font-family: var(--font-mono); }
.eyebrow { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ------------------------------------------------------------ header */
.app-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.hdr { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; white-space: nowrap; }
.brand b { color: var(--marm); font-weight: 600; }
.topnav { display: flex; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.topnav button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.topnav button:hover { color: var(--ink); }
.topnav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.badge-dot { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--honey); color: var(--on-honey); font-size: 0.7rem; font-weight: 800; display: inline-grid; place-items: center; }
.exp { position: relative; display: flex; align-items: center; min-width: 0; }
.exp select { appearance: none; -webkit-appearance: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 7px 34px 7px 14px; font-weight: 700; max-width: 260px; text-overflow: ellipsis; cursor: pointer; }
.exp::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.status-dot.ok { background: var(--good); } .status-dot.warn { background: var(--honey-hover); } .status-dot.bad { background: var(--bad); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.bottomnav { display: none; }
@media (max-width: 720px) {
  :root { --nav-h: 64px; }
  .topnav, .brand-text { display: none; }
  .hdr { gap: 8px; padding: 8px 12px; }
  .hdr .spacer { display: none; }
  .exp { flex: 1; } .exp select { max-width: none; width: 100%; }
  .bottomnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bottomnav button { border: 0; background: none; height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 0.72rem; font-weight: 800; color: var(--ink-3); cursor: pointer; position: relative; }
  .bottomnav button[aria-current="page"] { color: var(--marm); }
  .bottomnav .badge-dot { position: absolute; top: 8px; left: calc(50% + 6px); }
}

/* ------------------------------------------------------------ layout */
main { margin: 0 auto; padding-inline: 16px; padding-block: 26px calc(56px + var(--nav-h)); display: flex; flex-direction: column; gap: 18px; max-width: 760px; }
main.wide { max-width: 1080px; }
.page-head { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.page-head .sub { color: var(--ink-2); max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head p { flex-basis: 100%; color: var(--ink-2); font-size: 0.88rem; }
.card-head.pad { padding: 18px 20px 4px; margin: 0; }
.foot { padding: 14px 20px 18px; border-top: 1px solid var(--line); }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }

/* ------------------------------------------------------------ controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 800; font-size: 0.92rem; white-space: nowrap; transition: background 0.15s, transform 0.06s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--honey); border-color: transparent; color: var(--on-honey); }
.btn.primary:hover { background: var(--honey-hover); }
.btn.lg { padding: 13px 22px; font-size: 1rem; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 12px; font-size: 0.84rem; }
.btn.block { width: 100%; }
input[type="text"], input[type="number"], select, textarea { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 9px 12px; min-width: 0; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--honey-hover); box-shadow: 0 0 0 3px color-mix(in srgb, var(--honey) 35%, transparent); }
textarea { resize: vertical; min-height: 72px; }
input[type="checkbox"] { accent-color: var(--marm-bright); width: 18px; height: 18px; }
input[type="range"] { accent-color: var(--marm-bright); width: 100%; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span:first-child { font-size: 0.84rem; font-weight: 700; color: var(--ink-2); }
.help { font-size: 0.8rem; color: var(--ink-3); }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.fields { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 13px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--ink-2); font-size: 0.88rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-weight: 700; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.doe { color: var(--series-1); background: color-mix(in srgb, var(--series-1) 12%, var(--surface)); }
.pill.bo { color: var(--marm); background: var(--marm-soft); }
.pill.good { color: var(--good); background: var(--good-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.score { font-weight: 800; min-width: 44px; text-align: center; padding: 3px 9px; border-radius: 999px; background: var(--honey-soft); color: var(--on-honey); font-size: 0.84rem; }
.notice { border-radius: 14px; padding: 12px 16px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 0.9rem; }
.notice.info { background: var(--surface-2); color: var(--ink-2); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice ul { margin: 6px 0 0; padding-left: 18px; font-weight: 500; }
.thinking { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); font-weight: 700; }
.thinking::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--honey); border-top-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------ lists */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 0; min-width: 0; }
.card.flush .item { padding: 14px 20px; }
button.item, .item.clickable { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: inherit; }
button.item:hover, .item.clickable:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.item .title { font-weight: 800; }
.item .meta { color: var(--ink-2); font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); flex: none; margin-right: 4px; }
.open > .item .chev { transform: rotate(45deg); }
.editor { padding: 4px 0 18px; display: flex; flex-direction: column; gap: 14px; }
.card.flush .editor { padding: 4px 20px 20px; }

/* ------------------------------------------------------------ cook */
.progress { display: flex; align-items: center; gap: 12px; font-size: 0.86rem; color: var(--ink-2); font-weight: 700; }
.bar { flex: 1; height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; max-width: 260px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--honey), var(--marm-bright)); border-radius: 999px; }
.next { background: linear-gradient(160deg, var(--honey-soft), var(--surface) 70%); border-color: color-mix(in srgb, var(--honey) 45%, var(--line)); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.next p { color: var(--ink-2); max-width: 56ch; }
.stepper-num { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px; }
.stepper-num button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); cursor: pointer; font-size: 1.1rem; font-weight: 800; color: var(--ink); }
.stepper-num span { min-width: 92px; text-align: center; font-weight: 700; color: var(--ink-2); }
.stepper-num b { color: var(--ink); font-size: 1.05rem; }
.steps { display: flex; gap: 8px; align-items: center; }
.steps span { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 0.86rem; color: var(--ink-3); }
.steps span i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 0.78rem; background: var(--surface-2); }
.steps span.on { color: var(--ink); } .steps span.on i { background: var(--honey); color: var(--on-honey); }
.steps span.done i { background: var(--good-soft); color: var(--good); }
.steps .sep { width: 22px; height: 2px; background: var(--line-strong); border-radius: 2px; }
.tickets { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ticket { font-family: var(--font-mono); font-weight: 600; font-size: 1.3rem; letter-spacing: 0.06em; background: var(--surface); border: 2px dashed var(--line-strong); border-radius: 12px; padding: 6px 14px 8px; text-align: center; line-height: 1.1; }
.ticket small { display: block; font-family: var(--font-body); font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; margin-bottom: 2px; }
.ticket.current { border-color: var(--marm-bright); border-style: solid; background: var(--marm-soft); }
.ticket.done { opacity: 0.55; }
.recipe { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.recipe header { display: flex; align-items: center; gap: 8px; }
.recipe .code { font-family: var(--font-mono); font-weight: 600; font-size: 1.15rem; }
.kv { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 5px; column-gap: 12px; font-size: 0.92rem; }
.kv > div { display: contents; }
.kv dt { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv dd { margin: 0; text-align: right; font-weight: 700; }
.kv dd .faint { font-weight: 500; }
.checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.checks label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.checks input { margin-top: 2px; flex: none; }
.taste { display: flex; flex-direction: column; gap: 20px; padding: 24px; }
.taste .big-code { font-family: var(--font-mono); font-weight: 600; font-size: clamp(2.6rem, 10vw, 3.4rem); letter-spacing: 0.08em; line-height: 1; }
.q { display: flex; flex-direction: column; gap: 8px; }
.q-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.q-head b { font-size: 1rem; }
.q-head .faint { font-size: 0.84rem; }
.info-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); background: none; color: var(--ink-3); font-weight: 800; font-size: 0.75rem; cursor: pointer; }
.rate { display: grid; grid-template-columns: repeat(auto-fit, minmax(40px, 1fr)); gap: 6px; }
.rate button { height: 46px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 800; font-size: 1rem; cursor: pointer; color: var(--ink); }
.rate button:hover { background: var(--surface-2); }
.rate button[aria-pressed="true"] { background: var(--honey); border-color: var(--honey-hover); color: var(--on-honey); }
.rate-ends { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--ink-3); font-weight: 700; }
.prop { padding: 14px 0; display: flex; flex-direction: column; gap: 12px; }
.prop-row { display: flex; align-items: center; gap: 12px; }
.prop-row .main { flex: 1; min-width: 0; cursor: pointer; }
.prop.rejected .prop-row .main { opacity: 0.5; text-decoration: line-through; }
.toggle-pair { display: inline-flex; gap: 6px; }
.toggle-pair button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--ink-3); }
.toggle-pair button.yes[aria-pressed="true"] { background: var(--good-soft); color: var(--good); border-color: transparent; }
.toggle-pair button.no[aria-pressed="true"] { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.sticky-foot { position: sticky; bottom: calc(var(--nav-h) + 12px); display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 8px 8px 18px; box-shadow: var(--shadow-lg); }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
.dots i.done { background: var(--good); } .dots i.on { background: var(--marm-bright); width: 22px; border-radius: 999px; }

/* ------------------------------------------------------------ insights */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--font-display); font-weight: 600; font-size: 1.75rem; line-height: 1.1; }
.stat .s { font-size: 0.8rem; color: var(--ink-3); }
